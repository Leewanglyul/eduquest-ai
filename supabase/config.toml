project_id = "eduquest-ai"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = false
# Mirror hosted Supabase defaults: rotation on, 10 s reuse tolerance (parallel requests that
# present the same refresh token converge instead of revoking the session).
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
